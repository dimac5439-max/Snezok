name: Собрать APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sborka-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Совместимость со старым способом: если загрузить в корень App*.java или
      # AndroidManifest*.xml, берётся самый новый из них вместо файла в src/main.
      - name: Подхватить загруженные в корень файлы
        run: |
          J=$(ls App*.java 2>/dev/null | sort -V | tail -n 1)
          M=$(ls AndroidManifest*.xml 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$J" ]; then echo "Беру $J"; cp "$J" src/main/java/ru/opsel/snezhok/App.java; fi
          if [ -n "$M" ]; then echo "Беру $M"; cp "$M" src/main/AndroidManifest.xml; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Сборка APK
        run: |
          gradle assembleDebug --no-daemon
          cp build/outputs/apk/debug/*.apk Snezhok.apk

      - name: Сохранить APK как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: Snezhok
          path: Snezhok.apk

      # Релиз обновляется только из основной ветки, чтобы пробные ветки его не затирали
      - name: Выложить APK в Releases
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete snezhok --yes --cleanup-tag || true
          gh release create snezhok Snezhok.apk --title "Снежок APK (сборка ${{ github.run_number }})" --notes "Скачай Snezhok.apk и установи"
