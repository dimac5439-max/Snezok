plugins {
    id 'com.android.application' version '8.5.2'
}

// Номер сборки из GitHub Actions: каждая новая сборка ставится поверх старой
def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int

android {
    namespace 'ru.opsel.snezhok'
    compileSdk 34

    defaultConfig {
        applicationId 'ru.opsel.snezhok'
        minSdk 26
        targetSdk 34
        versionCode buildNumber
        versionName "1.${buildNumber}"
    }

    // Постоянный ключ подписи. Раньше на каждом запуске CI создавался новый,
    // и обновление не ставилось поверх старой версии без удаления.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
